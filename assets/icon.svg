<svg xmlns="http://www.w3.org/2000/svg" width="1024" height="1024" viewBox="0 0 1024 1024">
  <defs>
    <radialGradient id="bg" cx="50%" cy="28%" r="80%">
      <stop offset="0" stop-color="#2B2F37"/>
      <stop offset="1" stop-color="#0B0C0F"/>
    </radialGradient>
    <linearGradient id="rim" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#FFFFFF" stop-opacity=".16"/>
      <stop offset=".5" stop-color="#FFFFFF" stop-opacity="0"/>
    </linearGradient>
    <linearGradient id="out" x1="232" y1="0" x2="792" y2="0" gradientUnits="userSpaceOnUse">
      <stop offset="0" stop-color="#FFFFFF" stop-opacity=".95"/>
      <stop offset="1" stop-color="#FFFFFF" stop-opacity=".12"/>
    </linearGradient>
    <linearGradient id="in" x1="232" y1="0" x2="792" y2="0" gradientUnits="userSpaceOnUse">
      <stop offset="0" stop-color="#5EE7C0" stop-opacity=".15"/>
      <stop offset=".55" stop-color="#5EE7C0"/>
      <stop offset="1" stop-color="#7CC8FF"/>
    </linearGradient>
    <filter id="glow" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="18" result="b"/>
      <feMerge><feMergeNode in="b"/><feMergeNode in="SourceGraphic"/></feMerge>
    </filter>
    <filter id="shadow" x="-10%" y="-10%" width="120%" height="125%">
      <feDropShadow dx="0" dy="14" stdDeviation="16" flood-color="#000" flood-opacity=".35"/>
    </filter>
  </defs>
  <g filter="url(#shadow)">
    <rect x="100" y="100" width="824" height="824" rx="185" fill="url(#bg)"/>
    <rect x="101.5" y="101.5" width="821" height="821" rx="183.5" fill="none" stroke="url(#rim)" stroke-width="3"/>
  </g>
  <!-- beat grid -->
  <g fill="#FFFFFF" fill-opacity=".14">
    <circle cx="272" cy="760" r="9"/><circle cx="352" cy="760" r="9"/><circle cx="432" cy="760" r="9"/><circle cx="512" cy="760" r="9"/>
    <circle cx="592" cy="760" r="9"/><circle cx="672" cy="760" r="9"/><circle cx="752" cy="760" r="9"/>
  </g>
  <!-- outgoing: equal-power fade out -->
  <path d="M232 312 C 452 312, 572 652, 792 652" fill="none" stroke="url(#out)" stroke-width="46" stroke-linecap="round"/>
  <!-- incoming: fade in -->
  <path d="M232 652 C 452 652, 572 312, 792 312" fill="none" stroke="url(#in)" stroke-width="46" stroke-linecap="round" filter="url(#glow)"/>
</svg>
